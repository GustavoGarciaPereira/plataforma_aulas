{% extends "base.html" %}
{% block title %}Entrar — Plataforma de Redação{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <h1 class="text-2xl font-bold mb-1">Entrar</h1>
  <p class="text-sm text-slate-500 mb-6">Acesse sua conta para continuar.</p>

  <form method="post" action="{{ url_for('login') }}" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div>
      <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
      <input type="email" id="email" name="email" required autofocus
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <div>
      <label for="senha" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
      <input type="password" id="senha" name="senha" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
      Entrar
    </button>
  </form>

  <p class="mt-4 text-sm text-slate-500 text-center">
    Não tem conta?
    <a href="{{ url_for('cadastro') }}" class="text-indigo-600 hover:underline">Criar conta</a>
  </p>
</div>
{% endblock %}
